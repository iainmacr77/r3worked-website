<!-- @dsCard group="Colors" viewport="700x150" name="Operational Status System" subtitle="Small system indicators only — never a dominant color block" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;font-family:var(--font-sans);background:var(--r3-porcelain);}
.row{display:flex;height:150px;align-items:center;gap:16px;padding:0 20px;}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;}
.dot{width:7px;height:7px;border-radius:50%;}
</style></head><body>
<div class="row">
  <span class="pill" style="color:var(--r3-status-live);background:var(--r3-status-live-dim);border:1px solid color-mix(in srgb, var(--r3-status-live) 30%, transparent);"><span class="dot" style="background:var(--r3-status-live);"></span>Live / Logged</span>
  <span class="pill" style="color:var(--r3-status-pending);background:var(--r3-status-pending-dim);border:1px solid color-mix(in srgb, var(--r3-status-pending) 30%, transparent);"><span class="dot" style="background:var(--r3-status-pending);"></span>Pending / Coming Soon</span>
  <span class="pill" style="color:var(--r3-coral);background:color-mix(in srgb, var(--r3-coral) 10%, transparent);border:1px solid color-mix(in srgb, var(--r3-coral) 25%, transparent);"><span class="dot" style="background:var(--r3-coral);"></span>Received</span>
  <span class="pill" style="color:var(--r3-status-inactive);background:rgba(22,22,22,0.04);border:1px solid rgba(22,22,22,0.1);"><span class="dot" style="background:var(--r3-status-inactive);"></span>Inactive</span>
</div>
</body></html>
