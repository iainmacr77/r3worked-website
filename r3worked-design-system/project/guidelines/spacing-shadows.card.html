<!-- @dsCard group="Spacing" viewport="700x220" name="Shadow System" subtitle="Soft card shadow vs the signature coral sticker-offset shadow" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--r3-porcelain);padding:28px 24px;display:flex;gap:32px;}
.card{width:150px;height:110px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--r3-ink);}
.panel{width:150px;height:110px;border-radius:20px;background:var(--r3-ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--r3-porcelain);}
</style></head><body>
<div class="card" style="box-shadow:var(--shadow-card-soft);">Soft card shadow</div>
<div class="panel" style="box-shadow:var(--shadow-sticker-coral);">Sticker offset shadow</div>
</body></html>
