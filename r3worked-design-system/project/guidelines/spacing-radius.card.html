<!-- @dsCard group="Spacing" viewport="700x200" name="Radius Scale" subtitle="From control radius to the full pill" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:var(--r3-porcelain);padding:20px 24px;display:flex;gap:14px;align-items:flex-end;}
.box{background:var(--r3-ink);color:var(--r3-porcelain);font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;}
</style></head><body>
<div class="box" style="width:60px;height:60px;border-radius:var(--radius-sm);">sm<br>8px</div>
<div class="box" style="width:60px;height:60px;border-radius:var(--radius-md);">md<br>12px</div>
<div class="box" style="width:60px;height:60px;border-radius:var(--radius-lg);">lg<br>16px</div>
<div class="box" style="width:70px;height:70px;border-radius:var(--radius-xl);">xl<br>20px</div>
<div class="box" style="width:80px;height:80px;border-radius:var(--radius-2xl);">2xl<br>24px</div>
<div class="box" style="width:90px;height:90px;border-radius:var(--radius-4xl);">4xl<br>32px</div>
<div class="box" style="width:110px;height:44px;border-radius:var(--radius-pill);">pill</div>
</body></html>
