<script type="text/babel">
const { SectionHeading, SegmentedToggle, Wordmark } = window.R3WORKEDDesignSystem_b9c054;
function Demo() {

  return (
    <div style={{padding:24, display:'flex', flexDirection:'column', gap:20}}>
      <Wordmark size="1.3rem" />
      <SectionHeading
        eyebrow="The System"
        title="The 3 in R3WORKED."
        description="Three practical layers that make your website look better, capture more enquiries, and help you stay on top of them."
      />
      <SegmentedToggle
        value={tab}
        onChange={setTab}
        options={[{value:'before',label:'Before'},{value:'after',label:'After'}]}
      />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
